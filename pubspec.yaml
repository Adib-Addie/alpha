name: alphagraphics
description: AlphaGraphics - Education App by Brolytics Technologies
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # UI & Animations
  google_fonts: ^6.2.1
  animations: ^2.0.11
  cached_network_image: ^3.4.1

  # File & Storage
  file_picker: ^6.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2

  # PDF & Printing
  pdf: ^3.11.3
  printing: ^5.14.2
  syncfusion_flutter_pdf: ^26.2.14

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.2
  share_plus: ^10.1.4

  cupertino_icons: ^1.0.8

flutter:
  uses-material-design: true

  assets:
    - assets/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
